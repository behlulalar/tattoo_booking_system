<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Randevu — Roof Tattoo Gallery</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/png" href="img/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100dvh;
      background: #111;
      color: #fff;
      font-family: 'Montserrat', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: max(24px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
    }
    .card {
      width: 100%;
      max-width: 460px;
      text-align: center;
      padding: 40px 28px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .logo { width: 72px; height: 72px; object-fit: contain; margin-bottom: 20px; }
    h1 { font-family: 'Bebas Neue', sans-serif; font-size: 1.7rem; letter-spacing: 1px; font-weight: 400; margin-bottom: 12px; }
    p { color: rgba(255, 255, 255, 0.6); font-size: 0.92rem; line-height: 1.6; margin-bottom: 26px; }
    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 12px 26px; border-radius: 10px;
      background: #fff; color: #000; text-decoration: none;
      font-size: 0.85rem; font-weight: 600; letter-spacing: 0.5px;
    }
  </style>
</head>
<body>
  <main class="card">
    <img src="img/logo.png" alt="Roof Tattoo Gallery" class="logo" />
    <h1>Randevunuzu Sanatçınız Verecek</h1>
    <p>Randevu saati artık sanatçımız tarafından belirleniyor. Sizinle WhatsApp üzerinden iletişime geçilecektir.</p>
    <a class="btn" href="/"><i class="fas fa-arrow-left"></i> Ana Sayfaya Dön</a>
  </main>
</body>
</html>
